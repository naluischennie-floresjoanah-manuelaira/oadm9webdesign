<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Reddit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP NAVBAR -->
  <div class="top-nav">
    <div class="nav-left">
      <span class="home-icon">🏠</span>
      <span class="url-bar">reddit.com</span>
    </div>
    <div class="nav-right">
      <span>▶</span>
      <span>📑</span>
      <span>⋮</span>
    </div>
  </div>

  <div class="modal-container">
    <div class="modal-box">
      <button class="close-btn" onclick="location.href='home.html'">×</button>

      <h2>Log In</h2>
      <p class="terms-text">By continuing, you agree to our <a href="#">User Agreement</a> and acknowledge that you understand the <a href="#">Privacy Policy</a>.</p>

      <button class="btn-option phone">📱 Continue With Phone Number</button>
      <button class="btn-option google">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.07 2.53-2.25 3.31v2.77h3.63c2.12-1.95 3.34-4.82 3.34-8.09z"/>
          <path fill="#34A853" d="M12 23c3.03 0 5.56-1 7.42-2.69l-3.63-2.77c-1.01.68-2.28 1.08-3.79 1.08-2.92 0-5.39-1.98-6.28-4.63H2.03v2.9C3.98 20.3 7.71 23 12 23z"/>
          <path fill="#FBBC05" d="M5.72 13.99c-.23-.68-.36-1.4-.36-2.14s.13-1.46.36-2.14V6.81H2.03C.76 8.44 0 10.18 0 12s.76 3.56 2.03 5.19l3.69-3.2z"/>
          <path fill="#EA4335" d="M12 5.38c1.64 0 3.11.56 4.26 1.66l3.19-3.19C17.55 2.12 14.92 1 12 1 7.71 1 3.98 3.7 2.03 7.81l3.69 3.2c.89-2.64 3.36-4.63 6.28-4.63z"/>
        </svg>
        Continue with Google
      </button>
      <button class="btn-option phone">🔗 Email me a one-time link</button>

      <div class="divider"><span>OR</span></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email or username *</label>
          <input type="text" id="userInput" required>
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="loginPassword" required>
          <span class="eye-icon"></span>
        </div>

        <a href="#" class="forgot-link">Forgot password?</a>

        <div class="error-msg"></div>

        <button type="submit" class="btn-submit active">Log In</button>
      </form>

      <p class="switch-text">New to Reddit? <a href="signup.html">Sign Up</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
